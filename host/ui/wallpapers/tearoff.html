<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>撕日曆：日期、干支年、宜忌（task 3.4）</title>
<!-- 字型：相對路徑、全部內建，不連任何外部網址 -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #140a0a; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  // 撕日曆：本機當天日期、星期、干支年，以及依台股休市、台積電法說會、財報密集週、旺季、融資警示與詞庫決定的「宜」「忌」。
  // 規則在 lib/tearoff-model.mjs（純函式、有單元測試），繪圖在 lib/tearoff-draw.mjs。
  // query：w、h、t、tz、fixture（見 lib/core.mjs 契約）。詞庫、門檻、旺季表、休市表來自 {data, config} 信封的 config，
  // 缺鍵由內建預設檔 config/wallpaper-config.default.json 補齊。
  import { runWallpaper } from './lib/wallpaper.mjs';
  import { TEAROFF_FONTS, drawTearoff, summarize } from './lib/tearoff-draw.mjs';

  runWallpaper({
    canvas: '#c',
    fonts: TEAROFF_FONTS,
    async draw(env) {
      const model = await drawTearoff(env);
      window.__wallpaperSummary = summarize(model); // 截圖稿記進證據檔
    },
  });
</script>
</body>
</html>
